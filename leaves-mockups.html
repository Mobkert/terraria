<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaves Block Mockups</title>
  <style>
    :root {
      --bg: #121821;
      --panel: #1b2431;
      --text: #dde7f5;
      --muted: #9eb0c6;
      --line: #2a374a;
      --accent: #8ccf7c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 30px;
    }

    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      max-width: 900px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }

    .label {
      margin: 0 0 6px;
      font-size: 14px;
      color: #f3f8ff;
    }

    .desc {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      min-height: 32px;
    }

    .pair {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .tile-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    canvas {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      border: 1px solid #3a475c;
      background:
        linear-gradient(45deg, #65758d 25%, transparent 25%),
        linear-gradient(-45deg, #65758d 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #65758d 75%),
        linear-gradient(-45deg, transparent 75%, #65758d 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }
  </style>
</head>
<body>
  <h1>Leaves Block Redesign Mockups</h1>
  <p class="sub">
    Transparent checkerboard = alpha. These options reduce clumping and add airy holes like Minecraft leaves.
    Each card shows <strong>Oak</strong> and <strong>Birch</strong> versions.
  </p>
  <div class="grid" id="grid"></div>

  <script>
    const SIZE = 32;

    const palettes = {
      oak: {
        base: '#2d7a2d',
        dark: '#1f6121',
        light: '#4ea04a',
        stem: '#2d5f2d',
      },
      birch: {
        base: '#cc7733',
        dark: '#9b561f',
        light: '#e7a35f',
        stem: '#8f4b1f',
      },
    };

    const styles = [
      {
        name: 'Current (Clumpy Reference)',
        note: 'Dense circular clusters with almost no holes.',
        draw: drawCurrent,
      },
      {
        name: 'Option A: Airy Pixels',
        note: 'Pixel clusters with clear transparent gaps.',
        draw: drawAiryPixels,
      },
      {
        name: 'Option B: Cross Canopy',
        note: 'Readable branch cross with scattered leaf bits.',
        draw: drawCrossCanopy,
      },
      {
        name: 'Option C: Natural Noise',
        note: 'Uneven, organic look with random-like openings.',
        draw: drawNaturalNoise,
      },
      {
        name: 'Option D: Chunk Border',
        note: 'Filled edges, airy middle to avoid blob silhouette.',
        draw: drawChunkBorder,
      },
    ];

    function addCard(style) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <p class="label">${style.name}</p>
        <p class="desc">${style.note}</p>
        <div class="pair">
          <div class="tile-wrap"><canvas></canvas><span>Oak</span></div>
          <div class="tile-wrap"><canvas></canvas><span>Birch</span></div>
        </div>
      `;

      const canvases = card.querySelectorAll('canvas');
      drawTile(canvases[0], palettes.oak, style.draw);
      drawTile(canvases[1], palettes.birch, style.draw);
      document.getElementById('grid').appendChild(card);
    }

    function drawTile(canvas, palette, painter) {
      canvas.width = SIZE;
      canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, SIZE, SIZE);
      painter(ctx, palette);
      addPixelBorder(ctx);
    }

    function addPixelBorder(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      ctx.fillRect(0, SIZE - 1, SIZE, 1);
      ctx.fillRect(SIZE - 1, 0, 1, SIZE);
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(0, 0, SIZE, 1);
      ctx.fillRect(0, 0, 1, SIZE);
    }

    function fillPixels(ctx, coords, color) {
      ctx.fillStyle = color;
      for (const [x, y] of coords) ctx.fillRect(x, y, 2, 2);
    }

    function drawCurrent(ctx, p) {
      ctx.fillStyle = p.base;
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.fillStyle = hexToRgba(p.dark, 0.45);
      const circles = [[4,4],[14,6],[24,4],[8,16],[18,14],[28,18],[6,26],[20,24]];
      for (const [x, y] of circles) {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawAiryPixels(ctx, p) {
      ctx.fillStyle = p.base;
      ctx.fillRect(0, 0, SIZE, SIZE);
      fillPixels(ctx, [
        [2,2],[6,2],[10,4],[14,2],[18,4],[22,2],[26,4],
        [4,8],[8,10],[12,8],[16,10],[20,8],[24,10],[28,8],
        [2,14],[6,16],[10,14],[14,16],[18,14],[22,16],[26,14],
        [4,20],[8,22],[12,20],[16,22],[20,20],[24,22],[28,20],
        [2,26],[6,28],[10,26],[14,28],[18,26],[22,28],[26,26],
      ], p.dark);
      fillPixels(ctx, [[4,4],[12,4],[20,4],[8,12],[16,12],[24,12],[6,24],[14,24],[22,24]], p.light);
      cutHoles(ctx, [[8,6],[16,6],[24,6],[4,14],[12,14],[20,14],[28,14],[8,22],[16,22],[24,22]]);
    }

    function drawCrossCanopy(ctx, p) {
      ctx.fillStyle = p.base;
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.fillStyle = hexToRgba(p.stem, 0.75);
      ctx.fillRect(14, 0, 4, SIZE);
      ctx.fillRect(0, 14, SIZE, 4);
      fillPixels(ctx, [[4,4],[8,6],[22,6],[26,4],[6,24],[10,26],[20,26],[24,24]], p.dark);
      fillPixels(ctx, [[12,2],[18,2],[2,12],[28,12],[2,18],[28,18],[12,28],[18,28]], p.light);
      cutHoles(ctx, [[4,12],[8,16],[12,20],[20,20],[24,16],[28,12],[12,8],[20,8]]);
    }

    function drawNaturalNoise(ctx, p) {
      ctx.fillStyle = p.base;
      ctx.fillRect(0, 0, SIZE, SIZE);
      fillPixels(ctx, [
        [2,4],[6,2],[10,6],[14,4],[18,2],[22,6],[26,4],
        [4,10],[8,12],[12,10],[16,8],[20,12],[24,10],[28,12],
        [2,16],[6,18],[10,14],[14,18],[18,16],[22,20],[26,16],
        [4,22],[8,24],[12,22],[16,26],[20,22],[24,24],[28,22],
        [2,28],[10,28],[18,28],[26,28],
      ], p.dark);
      fillPixels(ctx, [[6,8],[18,8],[24,14],[8,20],[20,24],[12,26]], p.light);
      cutHoles(ctx, [[4,6],[16,4],[24,8],[10,12],[28,18],[6,22],[14,24],[22,26]]);
    }

    function drawChunkBorder(ctx, p) {
      ctx.fillStyle = p.base;
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.fillStyle = hexToRgba(p.dark, 0.55);
      ctx.fillRect(0, 0, SIZE, 4);
      ctx.fillRect(0, 28, SIZE, 4);
      ctx.fillRect(0, 0, 4, SIZE);
      ctx.fillRect(28, 0, 4, SIZE);
      fillPixels(ctx, [[6,6],[12,8],[20,8],[24,6],[8,20],[14,18],[20,20],[24,22]], p.light);
      cutHoles(ctx, [[10,12],[16,12],[22,12],[8,18],[14,18],[20,18],[12,24],[18,24]]);
    }

    function cutHoles(ctx, holes) {
      for (const [x, y] of holes) ctx.clearRect(x, y, 2, 2);
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    styles.forEach(addCard);
  </script>
</body>
</html>
