<script>
const S = 32;

function colorToCSS(hex) {
  const r = (hex >> 16) & 0xff;
  const g = (hex >> 8) & 0xff;
  const b = hex & 0xff;
  return `rgb(${r},${g},${b})`;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function addBorderShading(ctx, s) {
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, s - 1, s, 1);
  ctx.fillRect(s - 1, 0, 1, s);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, 0, s, 1);
  ctx.fillRect(0, 0, 1, s);
}

function addSlabDetail(ctx, s) {
  const h = s / 2, y0 = s / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, y0 + h * 0.4, s, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(0, y0 + h * 0.2, s, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  for (let i = 0; i < 4; i++) {
    const px = Math.floor(s * (0.15 + i * 0.22));
    const py = y0 + Math.floor(h * (0.2 + (i % 2) * 0.35));
    ctx.fillRect(px, py, 2, 2);
  }
}

function generateBlockTexture(id) {
  const data = BlockData[id];
  if (!data) return null;
  const s = S;
  const c = makeCanvas(s, s);
  const ctx = c.getContext('2d');

  if (data.halfHeight) {
    ctx.fillStyle = colorToCSS(data.color);
    ctx.fillRect(0, s/2, s, s/2);
    addSlabDetail(ctx, s);
    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(0,s-1,s,1); ctx.fillRect(s-1,s/2,1,s/2);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0,s/2,s,1); ctx.fillRect(0,s/2,1,s/2);
  } else {
    ctx.fillStyle = colorToCSS(data.color);
    ctx.fillRect(0, 0, s, s);
    if (data.topColor) {
      ctx.fillStyle = colorToCSS(data.topColor);
      ctx.fillRect(0, 0, s, Math.floor(s/4));
    }
    drawBlockDetail(ctx, id, data, s);
    if (data.solid !== false && id !== 33) addBorderShading(ctx, s);
  }
  return c;
}

  ctx.fillStyle=lc; ctx.beginPath(); ctx.moveTo(s*0.16,s*0.12); ctx.quadraticCurveTo(s*0.5,s*0.08,s*0.84,s*0.12); ctx.lineTo(s*0.84,s*0.14); ctx.quadraticCurveTo(s*0.5,s*0.1,s*0.16,s*0.14); ctx.closePath(); ctx.fill();

function styled(canvas, displayW, displayH) {
  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';
  canvas.style.imageRendering = 'pixelated';
  return canvas;
}

function card(canvas, name, detailsHTML) {
  const div = document.createElement('div');
  div.className = 'card';
  div.appendChild(canvas);
  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = `<div class="name">${name}</div><div class="details">${detailsHTML}</div>`;
  div.appendChild(info);
  return div;
}

function toolTag(t) {
  if (t === 'pickaxe') return '<span class="tag tag-pickaxe">Pickaxe</span>';
  if (t === 'axe') return '<span class="tag tag-axe">Axe</span>';
  if (t === 'shovel') return '<span class="tag tag-shovel">Shovel</span>';
  return '<span class="tag tag-none">Any</span>';
}

function section(title, id) {
  const s = document.createElement('div');
  s.className = 'section';
  s.innerHTML = `<div class="section-title">${title}</div>`;
  const g = document.createElement('div');
  g.className = 'grid';
  s.appendChild(g);
  return { section: s, grid: g };
}

function addBlockCard(grid, id, extra) {
  const data = BlockData[id];
  if (!data) return;
  const c = generateBlockTexture(id);
  styled(c, DISPLAY, DISPLAY);
  let det = toolTag(data.tool);
  if (data.interactable) det += '<span class="tag tag-interactable">Interactable</span>';
  if (data.halfHeight) det += '<span class="tag tag-slab">Slab</span>';
  if (data.lightLevel) det += `<span class="tag tag-light">Light: ${data.lightLevel}</span>`;
  if (data.solid === false) det += ' Non-solid';
  det += ` <span>Hardness: ${data.hardness}</span>`;
  if (data.minTier) det += ` <span>Min Tier: ${data.minTier === 2 ? 'Stone' : data.minTier}</span>`;
  if (extra) det += '<br>' + extra;
  grid.appendChild(card(c, data.name, det));
}

function addItemCard(grid, id, extra) {
  const c = generateItemTexture(id);
  styled(c, DISPLAY, DISPLAY);
  grid.appendChild(card(c, extra.name, extra.details));
}
